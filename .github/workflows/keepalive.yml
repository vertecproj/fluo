name: keepalive
# 1x por semana: chama o Supabase (projeto gratis pausa apos 7 dias sem uso)
# e grava a data em keepalive.txt (o GitHub desliga agendamentos de repositorios parados ha 60 dias).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://zckbxbedwddqcczcwnwi.supabase.co/rest/v1/rpc/ping" -H "apikey: sb_publishable_zVWTld9W69XXGaBrG_8IRg_kt6l_XWT" -H "Content-Type: application/json" -d "{}"
      - name: Registrar atividade
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "keepalive" && git push || true
